# Render Blueprint: free web service. Pair it with a free hosted Postgres (e.g. Neon) and paste its
# connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: help-seeker
    runtime: node
    plan: free
    # Keep the server in the same region as the Neon database (ap-southeast-1 = Singapore): every request makes
    # database queries, and a region can't be changed after the service is created.
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    # Deploys are triggered by the GitHub Actions pipeline (.github/workflows/ci.yml) after all checks pass,
    # so Render must not also deploy on every push.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
