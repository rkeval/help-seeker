<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Seeker – Find a Housekeeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Help Seeker</h1>
    <p>Find trusted housekeepers for cleaning, dishwashing, cooking and more.</p>
    <nav>
      <button data-tab="find" class="active">Find a housekeeper</button>
      <button data-tab="join">I'm a housekeeper</button>
      <button data-tab="requests">Requests</button>
    </nav>
  </header>

  <main>
    <section id="find">
      <form id="filters" class="card">
        <label>Service
          <select id="f-service"><option value="">Any</option></select>
        </label>
        <label>City / area
          <input id="f-city" placeholder="e.g. Pune">
        </label>
        <label>Max rate / hour
          <input id="f-rate" type="number" min="0" placeholder="Any">
        </label>
        <label>Availability
          <select id="f-avail">
            <option value="">Any</option>
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Weekends</option>
          </select>
        </label>
        <label>Sort by
          <select id="f-sort">
            <option value="rating">Rating</option>
            <option value="rate">Lowest rate</option>
            <option value="exp">Experience</option>
          </select>
        </label>
      </form>
      <p id="count" class="muted"></p>
      <div id="results" class="grid"></div>
    </section>

    <section id="join" hidden>
      <form id="join-form" class="card stack">
        <h2>List yourself</h2>
        <label>Name <input name="name" required></label>
        <label>City / area <input name="city" required></label>
        <label>Phone <input name="phone" required pattern="[0-9+\- ]{7,}"></label>
        <label>Rate per hour <input name="rate" type="number" min="0" required></label>
        <label>Years of experience <input name="exp" type="number" min="0" value="0"></label>
        <label>Availability
          <select name="avail"><option>Full-time</option><option>Part-time</option><option>Weekends</option></select>
        </label>
        <fieldset><legend>Services you offer</legend><div id="svc-checks"></div></fieldset>
        <label>About you <textarea name="bio" rows="3"></textarea></label>
        <button type="submit">Create profile</button>
      </form>
    </section>

    <section id="requests" hidden>
      <h2>Contact requests</h2>
      <p class="muted">Requests you sent are stored in this browser.</p>
      <div id="req-list" class="stack"></div>
    </section>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="req-form" class="stack">
      <h3 id="dlg-title"></h3>
      <label>Your name <input name="who" required></label>
      <label>Your phone <input name="phone" required></label>
      <label>When do you need help? <input name="when" placeholder="e.g. Mon–Fri mornings"></label>
      <label>Details <textarea name="note" rows="3" placeholder="Tasks, home size, language…"></textarea></label>
      <div class="row">
        <button value="cancel" formnovalidate type="button" id="dlg-cancel" class="ghost">Cancel</button>
        <button type="submit">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
