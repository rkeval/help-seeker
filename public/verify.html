<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="verifypage.title">Confirm your email – Help Seeker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="top"><h1>Help Seeker</h1><div id="lang-slot"></div></div></header>
  <main>
    <p id="status" class="msg" role="status" data-i18n="verifypage.confirming">Confirming your email…</p>
    <p id="next" hidden></p>
  </main>
  <script src="i18n/core.js"></script>
  <script src="i18n/web.js"></script>
  <script>
    const status = document.getElementById("status");
    const next = document.getElementById("next");
    const token = new URLSearchParams(location.search).get("token") || "";
    history.replaceState(null, "", "/verify.html"); // keep the one-time token out of the address bar and history
    const t = (k, p) => I18n.t(k, p);
    let current = null; // what is on screen, so a language switch can redraw it

    // `message` is a function so it is re-evaluated in the new language. `nextKey` is a translated sentence with a {link}
    // placeholder; the anchor is built as a DOM node (no HTML in translations), so word order is each translation's own.
    function show(message, ok, nextKey, linkKey) {
      current = [message, ok, nextKey, linkKey];
      status.removeAttribute("data-i18n");
      status.textContent = message();
      status.className = "msg" + (ok ? "" : " err");
      next.replaceChildren();
      next.hidden = !nextKey;
      if (!nextKey) return;
      const [before, after] = t(nextKey, { link: "\u0001" }).split("\u0001");
      const a = document.createElement("a");
      a.href = "/"; a.textContent = t(linkKey);
      next.append(before, a, after || "");
    }
    I18n.onChange(() => { if (current) show(...current); });

    (async () => {
      await I18n.init();
      I18n.mountPicker(document.getElementById("lang-slot"));
      if (!token) return show(() => t("verifypage.no_token"), false);
      try {
        const res = await fetch("/api/email-verification/confirm", {
          method: "POST", headers: { "Content-Type": "application/json", "Accept-Language": I18n.lang }, body: JSON.stringify({ token }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) return show(() => t("verifypage.ok"), true, "verifypage.next_ok", "verifypage.next_ok_link");
        show(() => I18n.errorMessage(data), false, "verifypage.next_fail", "app.name");
      } catch {
        show(() => t("net.reach_reload"), false);
      }
    })();
  </script>
</body>
</html>
