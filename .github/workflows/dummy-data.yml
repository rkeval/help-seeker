# Manual only: loads (or removes) the fake demo housekeepers on the LIVE database.
# Needs the repo secret LIVE_DATABASE_URL (the Neon connection string). Never prints it.
name: Dummy data on the live site
on:
  workflow_dispatch:
    inputs:
      action:
        description: "add = show the fake housekeepers on the live site, remove = take them off again"
        type: choice
        options: [add, remove]
        default: add
      confirm:
        description: 'Type "live" to confirm you want to change the LIVE database'
        required: true
permissions:
  contents: read
jobs:
  dummy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation and secret
        env:
          CONFIRM: ${{ inputs.confirm }}
          HAS_URL: ${{ secrets.LIVE_DATABASE_URL != '' }}
        run: |
          [ "$CONFIRM" = "live" ] || { echo '::error::Type "live" in the confirm box to continue.'; exit 1; }
          [ "$HAS_URL" = "true" ] || { echo '::error::Add the repo secret LIVE_DATABASE_URL first (Settings > Secrets and variables > Actions).'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
          ALLOW_DUMMY_DATA: "1"
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "remove" ]; then node server/seed-dummy.js --remove; else node server/seed-dummy.js; fi
